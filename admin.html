<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEXUS • Control Center & Admin</title>
  
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 900px; margin-top: 20px;">
    
    <!-- ÜST BAR -->
    <div class="nav-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="./icon.svg" alt="NEXUS" style="width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);">
        <div>
          <h2 style="color: #ff007f; margin: 0; font-size: 1.25rem;">NEXUS Master Control</h2>
          <span style="font-size: 0.8rem; color: #94a3b8;">User Directory, Bookings & Event Authority</span>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="index.html" class="btn" style="padding: 8px 16px; font-size: 0.85rem; text-decoration: none;">← Back to App</a>
        <a href="dev.html" class="btn btn-pink" style="padding: 8px 16px; font-size: 0.85rem; text-decoration: none;">⚡ Dev Engine</a>
      </div>
    </div>

    <!-- SEKMELER -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button id="tab-users-btn" class="btn" style="flex: 1; border-color: #00f2fe;">👥 Users & Profiles</button>
      <button id="tab-bookings-btn" class="btn btn-pink" style="flex: 1;">📅 Master Bookings</button>
      <button id="tab-events-btn" class="btn" style="flex: 1;">🎉 All Events</button>
    </div>

    <!-- 1. KULLANICILAR VE PROFİLLER LİSTESİ -->
    <div id="admin-sec-users" class="glass-box" style="margin-bottom: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
        <h3 style="color: #00f2fe; margin: 0;">Registered Members Directory</h3>
        <input type="text" id="admin-user-search" class="input-field" placeholder="🔍 Search member..." style="max-width: 250px; margin-bottom: 0;">
      </div>

      <div id="admin-users-table-wrap" style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left;">
          <thead>
            <tr style="border-bottom: 1px solid rgba(0, 242, 254, 0.3); color: #00f2fe;">
              <th style="padding: 10px 8px;">User / Avatar</th>
              <th style="padding: 10px 8px;">Contact & IG</th>
              <th style="padding: 10px 8px;">Event Host Role</th>
              <th style="padding: 10px 8px; text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-users-tbody">
            <tr><td colspan="4" style="padding: 14px; text-align: center; color: #94a3b8;">Loading user directory...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 2. RANDEVULAR LİSTESİ -->
    <div id="admin-sec-bookings" class="glass-box" style="display: none; margin-bottom: 20px;">
      <h3 style="color: #ff007f; margin-bottom: 14px;">Master Appointment Schedule</h3>
      <div id="admin-bookings-list" style="display: grid; gap: 10px;">
        <p style="color: #94a3b8;">Loading bookings...</p>
      </div>
    </div>

    <!-- 3. TÜM ETKİNLİKLER LİSTESİ -->
    <div id="admin-sec-events" class="glass-box" style="display: none; margin-bottom: 20px;">
      <h3 style="color: #00f2fe; margin-bottom: 14px;">All System Events</h3>
      <div id="admin-events-list" style="display: grid; gap: 10px;">
        <p style="color: #94a3b8;">Loading events...</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { supabase } from './config.js';

    let allUsers = [];

    // Güvenlik: Admin kontrolü
    const loggedUser = JSON.parse(localStorage.getItem('portal_user') || 'null');
    if (!loggedUser || (!loggedUser.is_admin && loggedUser.role !== 'admin')) {
      alert('Access Denied: Administrator privileges required.');
      window.location.href = 'index.html';
    }

    // Sekme Geçişleri
    const secUsers = document.getElementById('admin-sec-users');
    const secBookings = document.getElementById('admin-sec-bookings');
    const secEvents = document.getElementById('admin-sec-events');

    document.getElementById('tab-users-btn').onclick = () => {
      secUsers.style.display = 'block';
      secBookings.style.display = 'none';
      secEvents.style.display = 'none';
      loadUsers();
    };

    document.getElementById('tab-bookings-btn').onclick = () => {
      secUsers.style.display = 'none';
      secBookings.style.display = 'block';
      secEvents.style.display = 'none';
      loadBookings();
    };

    document.getElementById('tab-events-btn').onclick = () => {
      secUsers.style.display = 'none';
      secBookings.style.display = 'none';
      secEvents.style.display = 'block';
      loadEvents();
    };

    // 1. KULLANICILARI ÇEK VE LİSTELE
    async function loadUsers() {
      const tbody = document.getElementById('admin-users-tbody');
      const { data: users, error } = await supabase.from('users').select('*').order('id', { ascending: true });

      if (error || !users) {
        tbody.innerHTML = `<tr><td colspan="4" style="color: #f43f5e; padding: 10px;">Error: ${error?.message}</td></tr>`;
        return;
      }

      allUsers = users;
      renderUsersTable(allUsers);
    }

    function renderUsersTable(list) {
      const tbody = document.getElementById('admin-users-tbody');
      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color: #94a3b8; padding: 14px; text-align: center;">No users match search.</td></tr>';
        return;
      }

      list.forEach(u => {
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';

        const av = u.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${u.username}`;
        const isHost = u.can_create_events || u.is_admin || u.role === 'admin';
        const igHandle = (u.instagram || '').replace('@', '').trim();

        tr.innerHTML = `
          <td style="padding: 10px 8px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <img src="${av}" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #00f2fe; object-fit: cover; background: #070913;" alt="Avatar">
              <div>
                <strong style="color: #f8fafc; font-size: 0.9rem;">${u.username}</strong>
                <span style="display: block; font-size: 0.72rem; color: #94a3b8;">${u.email}</span>
              </div>
            </div>
          </td>
          <td style="padding: 10px 8px;">
            <div>${u.phone ? `<span style="color: #22c55e;">📞 ${u.phone}</span>` : '<span style="color: #64748b;">No phone</span>'}</div>
            <div style="margin-top: 2px;">
              ${igHandle ? `<a href="${igHandle.startsWith('http') ? igHandle : 'https://instagram.com/' + igHandle}" target="_blank" style="color: #ff007f; text-decoration: none; font-size: 0.75rem;">📸 @${igHandle} ↗</a>` : '<span style="color: #64748b; font-size: 0.75rem;">No IG</span>'}
            </div>
          </td>
          <td style="padding: 10px 8px;">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: ${isHost ? '#00f2fe' : '#94a3b8'};">
              <input type="checkbox" class="host-toggle-chk" data-id="${u.id}" ${isHost ? 'checked' : ''}>
              <span>Host Events</span>
            </label>
          </td>
          <td style="padding: 10px 8px; text-align: right;">
            <button class="btn-del-user" data-id="${u.id}" data-name="${u.username}" style="background: rgba(244,63,94,0.15); border: 1px solid #f43f5e; color: #f43f5e; border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer;">Delete</button>
          </td>
        `;

        // Host Yetkisi Değişimi
        tr.querySelector('.host-toggle-chk').onchange = async (e) => {
          const val = e.target.checked;
          await supabase.from('users').update({ can_create_events: val }).eq('id', u.id);
        };

        // Kullanıcı Silme
        tr.querySelector('.btn-del-user').onclick = async () => {
          if (!confirm(`Are you sure you want to permanently delete user "${u.username}"?`)) return;
          await supabase.from('users').delete().eq('id', u.id);
          loadUsers();
        };

        tbody.appendChild(tr);
      });
    }

    // Arama Filtresi
    document.getElementById('admin-user-search').oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allUsers.filter(u => 
        u.username.toLowerCase().includes(q) || 
        u.email.toLowerCase().includes(q) ||
        (u.phone && u.phone.toLowerCase().includes(q))
      );
      renderUsersTable(filtered);
    };

    // 2. RANDEVULARI YÜKLE
    async function loadBookings() {
      const wrap = document.getElementById('admin-bookings-list');
      wrap.innerHTML = '<p style="color: #94a3b8;">Loading bookings...</p>';

      const { data: bookings, error } = await supabase.from('bookings').select('*').order('date', { ascending: false });

      if (error || !bookings || bookings.length === 0) {
        wrap.innerHTML = '<p style="color: #64748b;">No bookings found.</p>';
        return;
      }

      wrap.innerHTML = '';
      bookings.forEach(b => {
        const card = document.createElement('div');
        card.style.cssText = 'background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;';
        card.innerHTML = `
          <div>
            <strong style="color: #00f2fe; font-size: 0.95rem;">${b.name || 'Anonymous Guest'}</strong>
            <span style="color: #94a3b8; font-size: 0.8rem; display: block;">📅 Date: ${b.date} • Hours: ${(b.slots || []).join(', ')}</span>
            <span style="color: #22c55e; font-size: 0.78rem;">📞 ${b.contact || 'No contact provided'}</span>
            <p style="color: #e2e8f0; font-size: 0.8rem; margin: 4px 0 0 0;">📝 ${b.plan || 'No note'}</p>
          </div>
          <button class="btn-del-booking" data-id="${b.id}" style="background: rgba(244,63,94,0.15); border: 1px solid #f43f5e; color: #f43f5e; border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer;">Cancel</button>
        `;

        card.querySelector('.btn-del-booking').onclick = async () => {
          if (!confirm('Cancel and delete this booking?')) return;
          await supabase.from('bookings').delete().eq('id', b.id);
          loadBookings();
        };

        wrap.appendChild(card);
      });
    }

    // 3. ETKİNLİKLERİ YÜKLE
    async function loadEvents() {
      const wrap = document.getElementById('admin-events-list');
      wrap.innerHTML = '<p style="color: #94a3b8;">Loading events...</p>';

      const { data: events, error } = await supabase.from('events').select('*').order('created_at', { ascending: false });

      if (error || !events || events.length === 0) {
        wrap.innerHTML = '<p style="color: #64748b;">No events found.</p>';
        return;
      }

      wrap.innerHTML = '';
      events.forEach(evt => {
        const card = document.createElement('div');
        card.style.cssText = 'background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;';
        card.innerHTML = `
          <div>
            <strong style="color: #00f2fe; font-size: 0.95rem;">${evt.title}</strong>
            <span style="color: #94a3b8; font-size: 0.8rem; display: block;">📍 ${evt.location || 'No location'} • 📅 ${evt.event_date || 'No date set'}</span>
          </div>
          <button class="btn-del-evt" data-id="${evt.id}" style="background: rgba(244,63,94,0.15); border: 1px solid #f43f5e; color: #f43f5e; border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer;">Delete Event</button>
        `;

        card.querySelector('.btn-del-evt').onclick = async () => {
          if (!confirm(`Delete event "${evt.title}" and all related chats/expenses?`)) return;
          await supabase.from('events').delete().eq('id', evt.id);
          loadEvents();
        };

        wrap.appendChild(card);
      });
    }

    loadUsers();
  </script>
</body>
</html>
