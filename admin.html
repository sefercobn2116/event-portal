<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: Arial, sans-serif; background: #070913; color: #fff; }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .nav-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .glass-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 1.3fr 2.2fr 1.2fr;
      gap: 18px;
      margin-top: 16px;
    }
    .user-list, .event-matrix, .audit-log {
      min-height: 300px;
    }
    .user-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; margin-bottom: 10px;
      background: rgba(255,255,255,0.03);
    }
    .user-name { font-weight: 700; }
    .user-email { color: #94a3b8; font-size: 0.75rem; }
    select, button, input {
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #fff; padding: 8px 10px;
    }
    .matrix-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%; border-collapse: collapse; min-width: 700px;
    }
    th, td {
      border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px 8px; text-align: center;
    }
    th {
      color: #00f2fe; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td:first-child {
      text-align: left; color: #fff; font-weight: 600;
    }
    input[type="checkbox"] {
      accent-color: #00f2fe; width: 16px; height: 16px;
    }
    .role-pill {
      padding: 4px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; display: inline-block;
    }
    .role-admin { background: rgba(255,0,127,0.15); color: #ff5ca8; }
    .role-manager { background: rgba(0,242,254,0.15); color: #00f2fe; }
    .role-user { background: rgba(34,197,94,0.15); color: #4ade80; }
    .audit-item {
      padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 10px;
    }
    .audit-title {
      font-size: 0.8rem; color: #00f2fe; font-weight: 700;
    }
    .audit-meta {
      color: #94a3b8; font-size: 0.72rem; margin-top: 4px;
    }
    .btn { cursor: pointer; }
    .btn-save {
      background: rgba(0,242,254,0.18); border-color: #00f2fe; color: #00f2fe; font-weight: 700;
    }
    .btn-small { padding: 6px 10px; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-header">
      <a href="index.html">← Back to Main Hub</a>
      <h2 style="background: linear-gradient(135deg, #ff007f, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">
        Admin Access Control
      </h2>
    </div>

    <div class="admin-grid">
      <div class="glass-box user-list">
        <h3 style="color:#00f2fe; margin-top:0;">Users</h3>
        <div id="user-list-container"></div>
      </div>

      <div class="glass-box event-matrix">
        <h3 style="color:#ff007f; margin-top:0;">Event Access Matrix</h3>
        <div class="matrix-wrap">
          <table>
            <thead>
              <tr id="matrix-head"></tr>
            </thead>
            <tbody id="matrix-body"></tbody>
          </table>
        </div>
        <div style="margin-top: 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button id="save-all-access" class="btn btn-save btn-small">💾 Save All Access</button>
          <button id="select-all" class="btn btn-small">Select All</button>
          <button id="clear-all" class="btn btn-small">Clear All</button>
        </div>
      </div>

      <div class="glass-box audit-log">
        <h3 style="color:#00f2fe; margin-top:0;">Audit Log</h3>
        <div id="audit-log-container"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './config.js';

    const currentUser = JSON.parse(localStorage.getItem('portal_user'));
    if (!currentUser || !currentUser.is_admin) {
      alert('Admin access only!');
      window.location.href = 'index.html';
    }

    const userListContainer = document.getElementById('user-list-container');
    const matrixHead = document.getElementById('matrix-head');
    const matrixBody = document.getElementById('matrix-body');
    const auditLogContainer = document.getElementById('audit-log-container');

    async function loadUsers() {
      const { data: users, error } = await supabase.from('users').select('*').order('username', { ascending: true });
      if (error) return console.error(error);

      userListContainer.innerHTML = '';
      users.forEach(u => {
        const row = document.createElement('div');
        row.className = 'user-row';

        const info = document.createElement('div');
        info.innerHTML = `
          <div class="user-name">${u.username}</div>
          <div class="user-email">${u.email || '-'}</div>
        `;

        const roleBox = document.createElement('select');
        roleBox.innerHTML = `
          <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
          <option value="manager" ${u.role === 'manager' ? 'selected' : ''}>Manager</option>
          <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
        `;

        roleBox.addEventListener('change', async () => {
          await supabase.from('users').update({ role: roleBox.value }).eq('id', u.id);
          await logAudit({
            admin_user_id: currentUser.id,
            target_user_id: u.id,
            action: 'change_role',
            details: `Role changed to ${roleBox.value}`
          });
          loadUsers();
          loadAuditLog();
        });

        row.appendChild(info);
        row.appendChild(roleBox);
        userListContainer.appendChild(row);
      });
    }

    async function loadEvents() {
      const { data: events } = await supabase.from('events').select('*').order('title', { ascending: true });
      const { data: users } = await supabase.from('users').select('*').order('username', { ascending: true });
      const { data: accesses } = await supabase.from('event_access').select('*');

      const accessMap = {};
      (accesses || []).forEach(a => {
        if (!accessMap[a.user_id]) accessMap[a.user_id] = new Set();
        accessMap[a.user_id].add(a.event_id);
      });

      matrixHead.innerHTML = '<th>User</th>' + (events || []).map(evt => `<th>${evt.title}</th>`).join('');
      matrixBody.innerHTML = '';

      (users || []).forEach(u => {
        const row = document.createElement('tr');
        const userCell = document.createElement('td');
        userCell.innerHTML = `
          <div style="font-weight:700;">${u.username}</div>
          <div style="font-size:0.7rem; color:#94a3b8;">${u.role || 'user'}</div>
        `;
        row.appendChild(userCell);

        (events || []).forEach(evt => {
          const cell = document.createElement('td');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = !!(accessMap[u.id] && accessMap[u.id].has(evt.id));
          checkbox.dataset.userId = u.id;
          checkbox.dataset.eventId = evt.id;
          cell.appendChild(checkbox);
          row.appendChild(cell);
        });

        matrixBody.appendChild(row);
      });
    }

    async function saveAllAccess() {
      const rows = [...document.querySelectorAll('#matrix-body tr')];
      const allEvents = await getEvents();
      const dataToInsert = [];

      for (const row of rows) {
        const userId = row.querySelector('input')?.dataset.userId;
        if (!userId) continue;

        const checked = [...row.querySelectorAll('input[type="checkbox"]:checked')];
        const selectedEventIds = checked.map(cb => Number(cb.dataset.eventId));

        await supabase.from('event_access').delete().eq('user_id', userId);

        if (selectedEventIds.length > 0) {
          selectedEventIds.forEach(eventId => {
            dataToInsert.push({ user_id: Number(userId), event_id: eventId });
          });
        }
      }

      if (dataToInsert.length > 0) {
        await supabase.from('event_access').insert(dataToInsert);
      }

      await logAudit({
        admin_user_id: currentUser.id,
        action: 'bulk_update_access',
        details: `Bulk access updated for ${dataToInsert.length} assignments`
      });

      loadEvents();
      loadAuditLog();
      alert('✅ Access updated successfully');
    }

    async function getEvents() {
      const { data } = await supabase.from('events').select('*');
      return data || [];
    }

    async function logAudit({ admin_user_id, target_user_id = null, action, details }) {
      await supabase.from('audit_logs').insert({
        admin_user_id,
        target_user_id,
        action,
        details
      });
    }

    async function loadAuditLog() {
      const { data: logs } = await supabase
        .from('audit_logs')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(12);

      auditLogContainer.innerHTML = '';
      (logs || []).forEach(log => {
        const item = document.createElement('div');
        item.className = 'audit-item';
        item.innerHTML = `
          <div class="audit-title">${log.action}</div>
          <div class="audit-meta">${log.details || '-'}</div>
          <div class="audit-meta">${new Date(log.created_at).toLocaleString()}</div>
        `;
        auditLogContainer.appendChild(item);
      });
    }

    document.getElementById('save-all-access').addEventListener('click', saveAllAccess);
    document.getElementById('select-all').addEventListener('click', () => {
      document.querySelectorAll('#matrix-body input[type="checkbox"]').forEach(cb => cb.checked = true);
    });
    document.getElementById('clear-all').addEventListener('click', () => {
      document.querySelectorAll('#matrix-body input[type="checkbox"]').forEach(cb => cb.checked = false);
    });

    async function initAdmin() {
      await loadUsers();
      await loadEvents();
      await loadAuditLog();
    }

    initAdmin();
  </script>
</body>
</html>
