<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Zero | Mission Control Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px 80px; display: flex; justify-content: center; }
    .container { max-width: 850px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    h1 { font-size: 1.8rem; color: var(--primary); font-weight: 800; }
    h2 { font-size: 1.2rem; margin-bottom: 12px; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: #fff; }
    button { background: var(--primary); color: #0b1120; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-danger { background: var(--danger); color: #fff; padding: 6px 12px; font-size: 0.8rem; }
    .btn-success { background: var(--success); color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--primary); }
    #loginScreen { text-align: center; max-width: 360px; margin: 80px auto; }
    #adminContent { display: none; }
    .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .cb-item { background: #0f172a; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- Passcode -->
  <div id="loginScreen" class="card">
    <h2 style="margin-bottom:16px;">🔒 Mission Control Access</h2>
    <input type="password" id="passInput" placeholder="Enter Admin Password..." style="margin-bottom:12px; text-align:center;" />
    <button onclick="checkPass()" style="width:100%;">Authenticate</button>
  </div>

  <div class="container" id="adminContent">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>⚙️ Event & Guest Command Studio</h1>
      <a href="index.html" target="_blank" style="color:var(--primary); font-size:0.9rem; text-decoration:none;">Open Portal ↗</a>
    </div>

    <!-- Create Event & Assign Guests -->
    <div class="card">
      <h2>🎉 Create New Event & Assign Authorized Guests</h2>
      <div class="form-row">
        <div>
          <label>Event Title</label>
          <input type="text" id="evTitle" placeholder="e.g. Belgrade Night Out" />
        </div>
        <div>
          <label>Date & Time</label>
          <input type="datetime-local" id="evDate" />
        </div>
      </div>
      <div style="margin-bottom:12px;">
        <label>Description / Details</label>
        <textarea id="evDesc" rows="2" placeholder="Shopping, cocktails, dinner..."></textarea>
      </div>

      <div style="margin-bottom:16px;">
        <label>Who Can See & Access This Event? (Check to Authorize):</label>
        <div id="guestCheckboxes" class="checkbox-group"></div>
      </div>

      <button class="btn-success" onclick="createEvent()">+ Publish Event to Selected Guests</button>
    </div>

    <!-- Active Events Table -->
    <div class="card">
      <h2>📅 All Events & Assigned Permissions</h2>
      <table>
        <thead>
          <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Authorized Guests</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="eventsTable"></tbody>
      </table>
    </div>

    <!-- Master Guest Whitelist -->
    <div class="card">
      <h2>🛡️ Master Guest List</h2>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="newGuestInput" placeholder="Add new person (e.g. Aleksandra)" />
        <button onclick="addMasterGuest()">Add Person</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="masterGuestsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://gzwuaorcfboiwztjpgng.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6d3Vhb3JjZmJvaXd6dGpwZ25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzIwODcsImV4cCI6MjEwNjg0ODA4N30.Z4xDS_h6sySGnro7EcUOO5b9S5OcJ61rujsCHLl6Ffc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allGuestsList = [];

    async function checkPass() {
      const pass = document.getElementById('passInput').value;
      if (pass === '2116') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminContent').style.display = 'flex';
        loadAll();
      } else {
        alert("Invalid Passcode!");
      }
    }

    async function loadAll() {
      // 1. Guests
      const { data: guests } = await supabaseClient.from('guests').select('*').order('name');
      allGuestsList = guests || [];
      
      const gTable = document.getElementById('masterGuestsTable');
      gTable.innerHTML = '';
      const cbGroup = document.getElementById('guestCheckboxes');
      cbGroup.innerHTML = '';

      allGuestsList.forEach(g => {
        gTable.innerHTML += `
          <tr>
            <td><strong>${g.name}</strong></td>
            <td><button class="btn-danger" onclick="deleteMasterGuest(${g.id})">Remove</button></td>
          </tr>
        `;
        cbGroup.innerHTML += `
          <label class="cb-item">
            <input type="checkbox" name="assignGuest" value="${g.name}"> ${g.name}
          </label>
        `;
      });

      // 2. Events
      const { data: evs } = await supabaseClient.from('events').select('*').order('event_date', { ascending: false });
      const evTable = document.getElementById('eventsTable');
      evTable.innerHTML = '';
      if (evs) {
        evs.forEach(e => {
          const d = new Date(e.event_date).toLocaleDateString();
          evTable.innerHTML += `
            <tr>
              <td><strong>${e.title}</strong></td>
              <td>${d}</td>
              <td style="color:var(--primary);">${(e.allowed_guests || []).join(', ')}</td>
              <td><button class="btn-danger" onclick="deleteEvent(${e.id})">Delete</button></td>
            </tr>
          `;
        });
      }
    }

    async function createEvent() {
      const title = document.getElementById('evTitle').value.trim();
      const date = document.getElementById('evDate').value;
      const desc = document.getElementById('evDesc').value.trim();

      const selectedGuests = [];
      document.querySelectorAll('input[name="assignGuest"]:checked').forEach(cb => {
        selectedGuests.push(cb.value);
      });

      if (!title || !date) {
        alert("Please provide title and date!");
        return;
      }

      await supabaseClient.from('events').insert([{
        title: title,
        event_date: new Date(date).toISOString(),
        description: desc,
        allowed_guests: selectedGuests
      }]);

      document.getElementById('evTitle').value = '';
      document.getElementById('evDesc').value = '';
      alert("Event created & assigned successfully!");
      loadAll();
    }

    async function deleteEvent(id) {
      if (confirm("Delete this event and all its archived photos?")) {
        await supabaseClient.from('events').delete().eq('id', id);
        loadAll();
      }
    }

    async function addMasterGuest() {
      const val = document.getElementById('newGuestInput').value.trim();
      if (!val) return;
      await supabaseClient.from('guests').insert([{ name: val }]);
      document.getElementById('newGuestInput').value = '';
      loadAll();
    }

    async function deleteMasterGuest(id) {
      if (confirm("Remove guest?")) {
        await supabaseClient.from('guests').delete().eq('id', id);
        loadAll();
      }
    }
  </script>
</body>
</html>
