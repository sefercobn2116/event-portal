<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard & User-Event Management</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Admin Panel Styles */
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 12px;
    }
    .admin-tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 16px;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
    }
    .admin-tab-btn.active {
      color: #00f2fe;
      border-bottom-color: #00f2fe;
    }

    /* User-Event Assignment Panel */
    .assignment-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 20px;
    }
    @media (max-width: 1024px) {
      .assignment-container {
        grid-template-columns: 1fr;
      }
    }

    .user-list-panel, .event-list-panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      max-height: 600px;
      overflow-y: auto;
    }

    .user-list-panel h3, .event-list-panel h3 {
      color: #00f2fe;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .user-item, .event-item {
      background: rgba(18, 24, 43, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-item:hover, .event-item:hover {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.1);
      transform: translateX(4px);
    }

    .user-item.selected {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.15);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    .user-name {
      font-weight: 600;
      color: #fff;
    }

    .user-email {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .user-role-badge {
      background: rgba(0, 242, 254, 0.2);
      color: #00f2fe;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .user-role-badge.admin {
      background: rgba(255, 0, 127, 0.2);
      color: #ff007f;
    }

    .assignment-controls {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      margin-top: 24px;
    }

    .assignment-controls h4 {
      color: #ff007f;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .event-checkboxes {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(18, 24, 43, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .checkbox-item:hover {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.1);
    }

    .checkbox-item input[type="checkbox"] {
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .checkbox-item label {
      flex: 1;
      cursor: pointer;
      color: #fff;
    }

    .btn-assign {
      background: linear-gradient(135deg, #00f2fe, #3b82f6);
      border: none;
      color: #000;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-assign:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.4);
    }

    .btn-assign:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.9rem;
      display: none;
    }

    .status-message.success {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.5);
      display: block;
    }

    .status-message.error {
      background: rgba(244, 63, 94, 0.2);
      color: #f43f5e;
      border: 1px solid rgba(244, 63, 94, 0.5);
      display: block;
    }

    /* 7 SÜTUNLU TAKVİM MATRİSİ (ADMIN) */
    .admin-cal-card {
      background: rgba(18, 24, 43, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .cal-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }
    .cal-nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }
    .cal-nav-btn:hover { background: #00f2fe; color: #000; }
    .cal-weekdays {
      display: grid !important;
      grid-template-columns: repeat(7, 1fr) !important;
      text-align: center;
      margin-bottom: 8px;
    }
    .cal-weekday-label {
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .cal-days-grid {
      display: grid !important;
      grid-template-columns: repeat(7, 1fr) !important;
      gap: 6px;
    }
    .cal-day-cell {
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      color: #64748b;
    }
    .cal-day-cell.available {
      background: rgba(0, 242, 254, 0.12);
      border-color: #00f2fe;
      color: #00f2fe;
      cursor: pointer;
    }
    .cal-day-cell.available:hover {
      background: #00f2fe;
      color: #070913;
    }
  </style>
</head>
<body>

  <!-- ================= ADMIN DASHBOARD ================= -->
  <div id="view-admin" class="container">
    <div class="nav-header">
      <div>
        <h2 id="admin-title">Admin Dashboard</h2>
        <span style="font-size: 0.85rem; color: #94a3b8;" id="admin-role-badge">Administrator</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="btn-back-portal" class="btn" style="width: auto; padding: 6px 16px; font-size: 0.85rem;">← Back to Portal</button>
        <button id="btn-logout-admin" class="btn" style="width: auto; padding: 6px 16px; font-size: 0.85rem;">Logout</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="admin-tabs">
      <button class="admin-tab-btn active" data-tab="assignment">👥 User-Event Assignment</button>
      <button class="admin-tab-btn" data-tab="calendar">📅 Availability Calendar</button>
      <button class="admin-tab-btn" data-tab="bookings">📋 Bookings</button>
    </div>

    <!-- TAB 1: USER-EVENT ASSIGNMENT -->
    <div id="tab-assignment" class="admin-tab-content">
      <p style="color: #94a3b8; margin-bottom: 20px;">Select a user and assign events they can access</p>

      <div class="assignment-container">
        <!-- USER LIST -->
        <div class="user-list-panel">
          <h3>👥 Users</h3>
          <div id="users-list"></div>
        </div>

        <!-- EVENTS CHECKBOXES -->
        <div>
          <div class="event-list-panel">
            <h3>🎉 Events</h3>
            <div id="events-list-checkboxes"></div>
          </div>

          <!-- ASSIGNMENT CONTROLS -->
          <div class="assignment-controls">
            <h4>Assign Events to Selected User</h4>
            <p id="selected-user-info" style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px;">Select a user first</p>
            <div class="event-checkboxes" id="assignment-checkboxes"></div>
            <button id="btn-save-assignment" class="btn-assign" disabled>💾 Save Assignment</button>
            <div id="assignment-status" class="status-message"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: AVAILABILITY CALENDAR -->
    <div id="tab-calendar" class="admin-tab-content" style="display: none;">
      <p style="color: #94a3b8; margin-bottom: 20px;">Manage availability slots for appointments</p>
      <!-- Calendar will be rendered here -->
      <div id="calendar-container"></div>
    </div>

    <!-- TAB 3: BOOKINGS -->
    <div id="tab-bookings" class="admin-tab-content" style="display: none;">
      <p style="color: #94a3b8; margin-bottom: 20px;">View and manage all appointment bookings</p>
      <div id="bookings-list" style="display: grid; gap: 16px;"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './config.js';

    let currentAdmin = null;
    let selectedUser = null;
    let selectedEventIds = [];

    // Check if user is logged in and is admin
    window.addEventListener('load', async () => {
      const user = JSON.parse(localStorage.getItem('portal_user'));
      if (!user || !user.is_admin) {
        window.location.href = 'index.html';
        return;
      }
      currentAdmin = user;
      document.getElementById('admin-title').textContent = `Admin Dashboard - ${user.username}`;
      
      await loadUsers();
      await loadEvents();
    });

    // TAB SWITCHING
    document.querySelectorAll('.admin-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabName = btn.dataset.tab;
        
        // Update active button
        document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update active content
        document.querySelectorAll('.admin-tab-content').forEach(content => {
          content.style.display = 'none';
        });
        document.getElementById(`tab-${tabName}`).style.display = 'block';

        // Load tab-specific data
        if (tabName === 'bookings') {
          loadBookings();
        } else if (tabName === 'calendar') {
          loadAvailabilityCalendar();
        }
      });
    });

    // LOAD USERS
    async function loadUsers() {
      const { data: users } = await supabase.from('users').select('*').order('username');
      const usersList = document.getElementById('users-list');
      usersList.innerHTML = '';

      (users || []).forEach(user => {
        const userItem = document.createElement('div');
        userItem.className = 'user-item';
        userItem.innerHTML = `
          <div style="flex: 1;">
            <div class="user-name">${user.username}</div>
            <div class="user-email">${user.email}</div>
          </div>
          <div class="user-role-badge ${user.is_admin ? 'admin' : ''}">
            ${user.is_admin ? 'Admin' : 'User'}
          </div>
        `;

        userItem.addEventListener('click', () => {
          document.querySelectorAll('.user-item').forEach(u => u.classList.remove('selected'));
          userItem.classList.add('selected');
          selectedUser = user;
          loadUserEventAssignments(user.id);
        });

        usersList.appendChild(userItem);
      });
    }

    // LOAD EVENTS
    async function loadEvents() {
      const { data: events } = await supabase.from('events').select('*').order('title');
      const eventsList = document.getElementById('events-list-checkboxes');
      eventsList.innerHTML = '';

      (events || []).forEach(event => {
        const item = document.createElement('div');
        item.className = 'checkbox-item';
        item.innerHTML = `
          <input type="checkbox" id="event-${event.id}" data-event-id="${event.id}">
          <label for="event-${event.id}">${event.title}</label>
        `;
        item.querySelector('input').addEventListener('change', updateSelectedEvents);
        eventsList.appendChild(item);
      });
    }

    // LOAD USER EVENT ASSIGNMENTS
    async function loadUserEventAssignments(userId) {
      const { data: assignments } = await supabase
        .from('event_access')
        .select('event_id')
        .eq('user_id', userId);

      const assignedEventIds = (assignments || []).map(a => a.event_id);

      document.querySelectorAll('#events-list-checkboxes input[type="checkbox"]').forEach(checkbox => {
        const eventId = parseInt(checkbox.dataset.eventId);
        checkbox.checked = assignedEventIds.includes(eventId);
      });

      updateAssignmentCheckboxes(assignedEventIds);
      document.getElementById('selected-user-info').textContent = `Selected: ${selectedUser.username}`;
      document.getElementById('btn-save-assignment').disabled = false;
    }

    function updateAssignmentCheckboxes(assignedEventIds = []) {
      const { data: events } = supabase.from('events').select('*');
      const container = document.getElementById('assignment-checkboxes');
      container.innerHTML = '';

      supabase.from('events').select('*').then(({ data: events }) => {
        (events || []).forEach(event => {
          const isAssigned = assignedEventIds.includes(event.id);
          const item = document.createElement('div');
          item.className = 'checkbox-item';
          item.innerHTML = `
            <input type="checkbox" id="assign-event-${event.id}" data-event-id="${event.id}" ${isAssigned ? 'checked' : ''}>
            <label for="assign-event-${event.id}">${event.title}</label>
          `;
          item.querySelector('input').addEventListener('change', () => {
            selectedEventIds = Array.from(document.querySelectorAll('#assignment-checkboxes input[type="checkbox"]:checked'))
              .map(cb => parseInt(cb.dataset.eventId));
          });
          container.appendChild(item);
        });
      });
    }

    function updateSelectedEvents() {
      selectedEventIds = Array.from(document.querySelectorAll('#events-list-checkboxes input[type="checkbox"]:checked'))
        .map(cb => parseInt(cb.dataset.eventId));
    }

    // SAVE ASSIGNMENT
    document.getElementById('btn-save-assignment').addEventListener('click', async () => {
      if (!selectedUser) {
        alert('Please select a user first');
        return;
      }

      const statusEl = document.getElementById('assignment-status');
      const selectedCheckboxes = Array.from(document.querySelectorAll('#assignment-checkboxes input[type="checkbox"]:checked'))
        .map(cb => parseInt(cb.dataset.eventId));

      try {
        // Remove old assignments
        await supabase.from('event_access').delete().eq('user_id', selectedUser.id);

        // Add new assignments
        if (selectedCheckboxes.length > 0) {
          const records = selectedCheckboxes.map(eventId => ({
            user_id: selectedUser.id,
            event_id: eventId,
            granted_by: currentAdmin.id,
            granted_at: new Date().toISOString()
          }));

          await supabase.from('event_access').insert(records);
        }

        statusEl.className = 'status-message success';
        statusEl.textContent = `✓ ${selectedUser.username} assigned to ${selectedCheckboxes.length} event(s)`;
      } catch (err) {
        statusEl.className = 'status-message error';
        statusEl.textContent = `✗ Error: ${err.message}`;
      }
    });

    // LOAD BOOKINGS
    async function loadBookings() {
      const { data: bookings } = await supabase.from('appointments').select('*').order('appointment_date', { ascending: false });
      const list = document.getElementById('bookings-list');
      list.innerHTML = '';

      (bookings || []).forEach(booking => {
        const card = document.createElement('div');
        card.className = 'glass-box';
        card.innerHTML = `
          <h4 style="color: #00f2fe; margin-bottom: 8px;">📅 ${booking.appointment_date}</h4>
          <p><strong>Client:</strong> ${booking.client_name}</p>
          <p><strong>Email:</strong> ${booking.client_email}</p>
          <p><strong>Contact:</strong> ${booking.client_contact}</p>
          <p><strong>Plan:</strong> ${booking.activity_plan}</p>
          <p style="color: #94a3b8; font-size: 0.85rem;"><strong>Hours:</strong> ${(booking.selected_slots || []).join(', ')}</p>
        `;
        list.appendChild(card);
      });
    }

    // LOAD AVAILABILITY CALENDAR
    async function loadAvailabilityCalendar() {
      // This can be expanded later for slot management
      const container = document.getElementById('calendar-container');
      container.innerHTML = '<p style="color: #94a3b8; text-align: center;">Calendar management coming soon</p>';
    }

    // LOGOUT
    document.getElementById('btn-logout-admin').addEventListener('click', () => {
      localStorage.removeItem('portal_user');
      window.location.href = 'index.html';
    });

    document.getElementById('btn-back-portal').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
