<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Zero ✦ Kontrol Paneli</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== SUPABASE BAĞLANTI AYARLARI =====
  const SUPABASE_URL = "https://gzwuaorcfboiwztjpgng.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6d3Vhb3JjZmJvaXd6dGpwZ25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzIwODcsImV4cCI6MjEwNjg0ODA4N30.Z4xDS_h6sySGnro7EcUOO5b9S5OcJ61rujsCHLl6Ffc";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<style>
  :root { --bg:#0f0f14; --card:#1a1a24; --accent:#7c5cff; --accent2:#00e0a4; --danger:#ff6b81; --text:#eaeaf0; --muted:#9a9ab0; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px; }
  .hidden { display:none !important; }

  /* ŞİFRE KAPISI */
  .gate { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; }
  .gate input { padding:14px 18px; border-radius:12px; border:1px solid #333; background:var(--card); color:var(--text); font-size:1.05rem; width:min(300px,90vw); text-align:center; outline:none; letter-spacing:4px; }
  .gate input:focus { border-color:var(--accent); }
  .btn { margin-top:14px; padding:13px 34px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn:hover { filter:brightness(1.15); }
  .btn-sm { padding:7px 14px; font-size:.85rem; margin-top:0; }
  .btn-danger { background:var(--danger); }
  .err { color:var(--danger); margin-top:12px; }

  header { display:flex; justify-content:space-between; align-items:center; padding-bottom:16px; border-bottom:1px solid #26263a; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .title { font-size:1.4rem; font-weight:700; }
  .title span { color:var(--accent2); }

  .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .tab { padding:10px 20px; border-radius:10px; background:var(--card); border:1px solid #26263a; color:var(--muted); cursor:pointer; font-size:.95rem; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .card { background:var(--card); border:1px solid #26263a; border-radius:16px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:1.1rem; margin-bottom:14px; color:var(--accent2); }
  input[type=text], input[type=datetime-local], textarea { width:100%; padding:11px 14px; border-radius:10px; border:1px solid #333; background:#12121c; color:var(--text); outline:none; margin-bottom:10px; font-family:inherit; }
  input:focus, textarea:focus { border-color:var(--accent); }
  label.f { font-size:.85rem; color:var(--muted); display:block; margin:6px 0 2px; }

  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pill { background:#12121c; border:1px solid #333; padding:6px 14px; border-radius:999px; font-size:.9rem; display:inline-flex; align-items:center; gap:8px; }
  .pill button { background:none; border:none; color:var(--danger); cursor:pointer; font-size:1rem; line-height:1; }

  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #26263a; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; }

  .cbx { display:inline-flex; align-items:center; gap:6px; background:#12121c; border:1px solid #333; padding:7px 14px; border-radius:999px; margin:0 6px 6px 0; cursor:pointer; font-size:.9rem; }
  .cbx input { accent-color:var(--accent); }
  .msg { margin-top:10px; font-size:.9rem; min-height:1.2em; }
  .ok { color:var(--accent2); } .bad { color:var(--danger); }
</style>
<base target="_blank">
</head>
<body>

<!-- ŞİFRE KAPISI -->
<div id="gate" class="gate">
  <div class="title" style="margin-bottom:20px">Plan <span>Zero</span> 🛰️ Kontrol Paneli</div>
  <input id="pass" type="password" placeholder="••••" inputmode="numeric">
  <button class="btn" onclick="unlock()">Giriş</button>
  <div class="err" id="gateErr"></div>
</div>

<!-- PANEL -->
<div id="panel" class="wrap hidden">
  <header>
    <span class="title">Plan <span>Zero</span> 🛰️</span>
    <button class="btn btn-sm btn-danger" onclick="lock()">Kilitle 🔒</button>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="showTab('guests', this)">👥 Davetliler</div>
    <div class="tab" onclick="showTab('events', this)">🎉 Etkinlikler</div>
  </div>

  <!-- DAVETLİLER -->
  <div id="tab-guests">
    <div class="card">
      <h2>Yeni Davetli Ekle</h2>
      <div class="row">
        <input type="text" id="newGuest" placeholder="İsim (örn: Aleksandra)" style="flex:1;margin-bottom:0">
        <button class="btn btn-sm" onclick="addGuest()">Ekle ➕</button>
      </div>
      <div class="msg" id="guestMsg"></div>
    </div>
    <div class="card">
      <h2>Davetli Listesi</h2>
      <div class="row" id="guestList"><span style="color:var(--muted)">Yükleniyor...</span></div>
    </div>
  </div>

  <!-- ETKİNLİKLER -->
  <div id="tab-events" class="hidden">
    <div class="card">
      <h2>Yeni Etkinlik Oluştur</h2>
      <label class="f">Etkinlik Adı</label>
      <input type="text" id="evTitle" placeholder="örn: Pazar Kahvaltısı + Doğa Yürüyüşü">
      <label class="f">Tarih & Saat</label>
      <input type="datetime-local" id="evDate">
      <label class="f">Açıklama</label>
      <textarea id="evDesc" rows="3" placeholder="Buluşma yeri, saat detayı, ne getirmeleri gerektiği..."></textarea>
      <label class="f">Kimler Katılabilir?</label>
      <div id="evGuests" style="margin-bottom:10px"><span style="color:var(--muted);font-size:.9rem">Önce davetli eklemelisin.</span></div>
      <button class="btn" onclick="createEvent()">Etkinliği Oluştur 🚀</button>
      <div class="msg" id="evMsg"></div>
    </div>
    <div class="card">
      <h2>Mevcut Etkinlikler</h2>
      <table>
        <thead><tr><th>Etkinlik</th><th>Tarih</th><th>Katılımcılar</th><th></th></tr></thead>
        <tbody id="evTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const ADMIN_PASS = "2116"; // Not: Bu yumuşak bir kilit — kodu gören herkes görür. Ciddi gizlilik gerekirse Supabase Auth kullanılmalı.
const LS_ADMIN = "pz_admin_ok";

function unlock() {
  if (document.getElementById("pass").value === ADMIN_PASS) {
    sessionStorage.setItem(LS_ADMIN, "1");
    openPanel();
  } else {
    document.getElementById("gateErr").textContent = "Yanlış şifre.";
  }
}
function lock() { sessionStorage.removeItem(LS_ADMIN); location.reload(); }

function openPanel() {
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  loadGuests();
  loadEvents();
}

function showTab(id, el) {
  document.getElementById("tab-guests").classList.toggle("hidden", id !== "guests");
  document.getElementById("tab-events").classList.toggle("hidden", id !== "events");
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
}

// ---------- DAVETLİLER ----------
async function loadGuests() {
  const { data } = await sb.from("guests").select("*").order("name");
  const box = document.getElementById("guestList");
  box.innerHTML = "";
  if (!data || data.length === 0) { box.innerHTML = "<span style='color:var(--muted)'>Henüz davetli yok.</span>"; }
  else data.forEach(g => {
    const pill = document.createElement("span");
    pill.className = "pill";
    pill.innerHTML = `${esc(g.name)} <button title="Sil" onclick="delGuest(${g.id}, '${esc(g.name)}')">✕</button>`;
    box.appendChild(pill);
  });
  // Etkinlik formundaki checkboxları da tazele
  const cb = document.getElementById("evGuests");
  cb.innerHTML = "";
  if (!data || data.length === 0) { cb.innerHTML = "<span style='color:var(--muted);font-size:.9rem'>Önce davetli eklemelisin.</span>"; }
  else data.forEach(g => {
    const l = document.createElement("label");
    l.className = "cbx";
    l.innerHTML = `<input type="checkbox" value="${esc(g.name)}"> ${esc(g.name)}`;
    cb.appendChild(l);
  });
}

async function addGuest() {
  const inp = document.getElementById("newGuest");
  const msg = document.getElementById("guestMsg");
  const name = inp.value.trim();
  if (!name) return;
  const { error } = await sb.from("guests").insert({ name });
  if (error) { msg.className = "msg bad"; msg.textContent = "❌ " + error.message; return; }
  msg.className = "msg ok"; msg.textContent = "✅ " + name + " eklendi.";
  inp.value = "";
  loadGuests();
}

async function delGuest(id, name) {
  if (!confirm(`"${name}" davetli listesinden silinsin mi?`)) return;
  await sb.from("guests").delete().eq("id", id);
  loadGuests();
}

// ---------- ETKİNLİKLER ----------
async function createEvent() {
  const title = document.getElementById("evTitle").value.trim();
  const dateVal = document.getElementById("evDate").value;
  const desc = document.getElementById("evDesc").value.trim();
  const msg = document.getElementById("evMsg");
  const guests = Array.from(document.querySelectorAll("#evGuests input:checked")).map(c => c.value);

  if (!title || !dateVal) { msg.className = "msg bad"; msg.textContent = "❌ Etkinlik adı ve tarih zorunlu."; return; }
  if (guests.length === 0) { msg.className = "msg bad"; msg.textContent = "❌ En az bir davetli seçmelisin."; return; }

  const { error } = await sb.from("events").insert({
    title, event_date: new Date(dateVal).toISOString(),
    description: desc, allowed_guests: guests.join(",")
  });
  if (error) { msg.className = "msg bad"; msg.textContent = "❌ " + error.message; return; }

  msg.className = "msg ok"; msg.textContent = "✅ Etkinlik oluşturuldu!";
  document.getElementById("evTitle").value = "";
  document.getElementById("evDate").value = "";
  document.getElementById("evDesc").value = "";
  document.querySelectorAll("#evGuests input").forEach(c => c.checked = false);
  loadEvents();
}

async function loadEvents() {
  const { data } = await sb.from("events").select("*").order("event_date");
  const tb = document.getElementById("evTable");
  tb.innerHTML = "";
  if (!data || data.length === 0) { tb.innerHTML = "<tr><td colspan='4' style='color:var(--muted)'>Henüz etkinlik yok.</td></tr>"; return; }
  data.forEach(ev => {
    const tr = document.createElement("tr");
    const d = new Date(ev.event_date);
    tr.innerHTML = `
      <td><b>${esc(ev.title)}</b><br><small style="color:var(--muted)">${esc(ev.description || "")}</small></td>
      <td>${d.toLocaleDateString("tr-TR")}<br><small style="color:var(--muted)">${d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</small></td>
      <td>${(ev.allowed_guests||"").split(",").map(g=>`<span class="pill" style="margin:2px 2px">${esc(g.trim())}</span>`).join("")}</td>
      <td><button class="btn btn-sm btn-danger" onclick="delEvent(${ev.id}, '${esc(ev.title)}')">Sil 🗑️</button></td>`;
    tb.appendChild(tr);
  });
}

async function delEvent(id, title) {
  if (!confirm(`"${title}" ve bağlı tüm anılar/öneriler silinsin mi?`)) return;
  const { error } = await sb.from("events").delete().eq("id", id);
  if (error) alert("Hata: " + error.message);
  loadEvents();
}

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

document.getElementById("pass").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
if (sessionStorage.getItem(LS_ADMIN) === "1") openPanel();
</script>
</body>
</html>
