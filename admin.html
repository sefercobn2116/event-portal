<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Zero | Mission Control</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    h1 { font-size: 1.8rem; color: var(--primary); font-weight: 800; }
    h2 { font-size: 1.2rem; margin-bottom: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: #fff; }
    button { background: var(--primary); color: #0b1120; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-danger { background: var(--danger); color: #fff; padding: 6px 12px; font-size: 0.8rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--primary); }
    #loginScreen { text-align: center; max-width: 360px; margin: 80px auto; }
    #adminContent { display: none; }
  </style>
</head>
<body>

  <!-- Password Screen -->
  <div id="loginScreen" class="card">
    <h2 style="margin-bottom:16px;">🔒 Mission Control Access</h2>
    <input type="password" id="passInput" placeholder="Enter Admin Password..." style="margin-bottom:12px; text-align:center;" />
    <button onclick="checkPass()" style="width:100%;">Authenticate</button>
  </div>

  <!-- Admin Panel -->
  <div class="container" id="adminContent">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>⚙️ Mission Control</h1>
      <a href="index.html" target="_blank" style="color:var(--primary); font-size:0.9rem; text-decoration:none;">Open Live Site ↗</a>
    </div>

    <!-- Update Event Settings -->
    <div class="card">
      <h2>📌 Event Briefing</h2>
      <div class="form-row">
        <div>
          <label>Event Headline</label>
          <input type="text" id="cfgTitle" />
        </div>
        <div>
          <label>Target Date & Time</label>
          <input type="datetime-local" id="cfgDate" />
        </div>
      </div>
      <div style="margin-bottom:12px;">
        <label>Subtitle / Subtext</label>
        <input type="text" id="cfgSubtitle" />
      </div>
      <button onclick="saveSettings()">Save & Deploy Live</button>
    </div>

    <!-- Activities & Votes -->
    <div class="card">
      <h2>📊 Live Activities & Polls</h2>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="newActTitle" placeholder="Add official activity..." />
        <button onclick="adminAddActivity()">Add</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Activity</th>
            <th>Added By</th>
            <th>Votes</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adminActsTable"></tbody>
      </table>
    </div>

    <!-- Participants Feed -->
    <div class="card">
      <h2>👥 Guest List & Responses</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>ETA</th>
            <th>Selections</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="participantsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://gzwuaorcfboiwztjpgng.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MqkdnbZ-rPkYOSG1R50f7w_QemOmJuv";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSettings = null;

    async function checkPass() {
      const pass = document.getElementById('passInput').value;
      const { data } = await supabaseClient.from('event_settings').select('*').eq('id', 1).single();
      currentSettings = data;

      if (data && data.admin_pass === pass) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminContent').style.display = 'flex';
        loadAdminData();
      } else {
        alert("Invalid Passcode!");
      }
    }

    async function loadAdminData() {
      document.getElementById('cfgTitle').value = currentSettings.title;
      document.getElementById('cfgSubtitle').value = currentSettings.subtitle;
      if (currentSettings.event_date) {
        const d = new Date(currentSettings.event_date);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        document.getElementById('cfgDate').value = d.toISOString().slice(0, 16);
      }

      const { data: acts } = await supabaseClient.from('activities').select('*').order('votes', { ascending: false });
      const actTable = document.getElementById('adminActsTable');
      actTable.innerHTML = '';
      acts.forEach(a => {
        actTable.innerHTML += `
          <tr>
            <td><strong>${a.title}</strong></td>
            <td>${a.added_by}</td>
            <td><strong style="color:var(--primary);">${a.votes || 0}</strong></td>
            <td><button class="btn-danger" onclick="deleteActivity(${a.id})">Delete</button></td>
          </tr>
        `;
      });

      const { data: parts } = await supabaseClient.from('participants').select('*').order('created_at', { ascending: false });
      const partTable = document.getElementById('participantsTable');
      partTable.innerHTML = '';
      parts.forEach(p => {
        partTable.innerHTML += `
          <tr>
            <td><strong>${p.name}</strong></td>
            <td>${p.arrival_time || '-'}</td>
            <td>${(p.selected_activities || []).join(', ')}</td>
            <td style="color:var(--text-muted);">${p.note || '-'}</td>
          </tr>
        `;
      });
    }

    async function saveSettings() {
      const title = document.getElementById('cfgTitle').value;
      const subtitle = document.getElementById('cfgSubtitle').value;
      const dateVal = document.getElementById('cfgDate').value;

      await supabaseClient.from('event_settings').update({
        title: title,
        subtitle: subtitle,
        event_date: new Date(dateVal).toISOString()
      }).eq('id', 1);

      alert("Settings updated successfully! Updated across all clients.");
    }

    async function adminAddActivity() {
      const val = document.getElementById('newActTitle').value.trim();
      if (!val) return;
      await supabaseClient.from('activities').insert([{ title: val, added_by: 'Admin', votes: 0 }]);
      document.getElementById('newActTitle').value = '';
      loadAdminData();
    }

    async function deleteActivity(id) {
      if (confirm("Are you sure you want to remove this activity?")) {
        await supabaseClient.from('activities').delete().eq('id', id);
        loadAdminData();
      }
    }
  </script>
</body>
</html>
