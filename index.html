<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Event Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cyber-neon: #00f3ff;
      --cyber-pink: #ff007f;
      --cyber-bg: #0a0e17;
      --glass-bg: rgba(16, 24, 39, 0.75);
      --glass-border: rgba(0, 243, 255, 0.2);
    }
    body {
      background-color: var(--cyber-bg);
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .text-cyber { color: var(--cyber-neon) !important; }
    .btn-cyber {
      background: transparent;
      color: var(--cyber-neon);
      border: 1px solid var(--cyber-neon);
      transition: all 0.3s;
    }
    .btn-cyber:hover {
      background: var(--cyber-neon);
      color: #000;
      box-shadow: 0 0 15px var(--cyber-neon);
    }
    .cal-day-cell {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .cal-day-cell:hover {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--cyber-neon);
    }
    .cal-day-cell.active-day {
      border-color: var(--cyber-neon);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="container-fluid max-w-7xl">
  <!-- Üst Bar -->
  <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
    <div class="d-flex align-items-center gap-3">
      <h2 class="m-0 text-cyber fw-bold">NEXUS</h2>
      <span class="badge bg-dark border border-secondary text-muted">Event Portal Hub</span>
    </div>
    <div id="user-nav" class="d-flex align-items-center gap-2"></div>
  </header>

  <!-- Login Modal / Box (Giriş Yapılmamışsa Görünür) -->
  <div id="auth-panel" class="row justify-content-center my-5" style="display: none;">
    <div class="col-md-5">
      <div class="glass-card p-4 text-center">
        <h3 class="text-cyber mb-3">Giriş Yap / Kaydol</h3>
        <input type="text" id="login-username" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Kullanıcı Adı">
        <input type="email" id="login-email" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="E-Posta">
        <button class="btn btn-cyber w-100" onclick="App.login()">Giriş Yap</button>
      </div>
    </div>
  </div>

  <!-- Ana İçerik Alanı -->
  <div id="main-panel" class="row g-4" style="display: none;">
    
    <!-- SOL KOLON: Etkinlikler & Akıllı Gerçek Takvim -->
    <div class="col-lg-5">
      <!-- Takvim Bölümü -->
      <div class="glass-card p-3 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <button class="btn btn-sm btn-outline-secondary" onclick="CalendarModule.changeMonth(-1)">&lt;</button>
          <h5 id="cal-month-title" class="m-0 text-cyber fw-bold"></h5>
          <button class="btn btn-sm btn-outline-secondary" onclick="CalendarModule.changeMonth(1)">&gt;</button>
        </div>
        <div class="d-grid mb-2 text-center text-muted small fw-bold" style="grid-template-columns: repeat(7, 1fr);">
          <div>Pt</div><div>Sa</div><div>Ça</div><div>Pe</div><div>Cu</div><div>Ct</div><div>Pz</div>
        </div>
        <div id="calendar-days-grid" class="d-grid gap-1" style="grid-template-columns: repeat(7, 1fr);"></div>

        <!-- Gün Seçildiğinde Açılan Saat Seçim Paneli -->
        <div id="slot-picker-drawer" class="mt-3 p-3 rounded bg-black bg-opacity-50 border border-secondary" style="display: none;">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span id="slot-picker-date" class="text-cyber fw-bold small"></span>
            <button class="btn-close btn-close-white small" onclick="CalendarModule.closeSlotPicker()"></button>
          </div>
          <p class="text-muted" style="font-size: 11px;">Müsait olduğun saatlere dokun (Yeşil = Boş/Müsait):</p>
          <div id="slot-hours-grid" class="d-flex flex-wrap gap-1"></div>
        </div>
      </div>

      <!-- Etkinlik Seçimi Listesi -->
      <div class="glass-card p-3">
        <h5 class="text-cyber mb-3">📅 Mevcut Etkinlikler</h5>
        <div id="events-list" class="d-flex flex-column gap-2"></div>
      </div>
    </div>

    <!-- SAĞ KOLON: Seçili Etkinlik Odası Paneli -->
    <div class="col-lg-7">
      <div id="room-placeholder" class="glass-card p-5 text-center text-muted">
        <h4>Bir etkinlik seçin</h4>
        <p>Detayları, sohbeti, görevleri ve katılım listesini görmek için soldan bir etkinliğe tıklayın.</p>
      </div>

      <div id="room-panel" style="display: none;" class="d-flex flex-column gap-3">
        
        <!-- Etkinlik Başlık & Detay Kartı -->
        <div class="glass-card p-3 d-flex justify-content-between align-items-center">
          <div>
            <h4 id="active-event-title" class="text-cyber m-0"></h4>
            <small id="active-event-meta" class="text-muted"></small>
          </div>
          <span class="badge bg-info text-dark" id="active-event-status">Oda Aktif</span>
        </div>

        <!-- RSVP & Katılımcı Onay Paneli (SADECE ORGANİZATÖR/ADMİN İÇİN DEĞİL CANLI İZLEME İÇİN) -->
        <div id="rsvp-requests-container" class="glass-card p-3"></div>

        <!-- İki Sütunlu Modül Izgarası -->
        <div class="row g-3">
          <!-- Split Bill (Expenses) -->
          <div class="col-md-6">
            <div id="expenses-container"></div>
          </div>
          <!-- Tasks (Who Brings What) -->
          <div class="col-md-6">
            <div id="tasks-container"></div>
          </div>
        </div>

        <!-- Alt Bölüm: Live Chat & Suggestions -->
        <div class="row g-3">
          <div class="col-md-7">
            <div id="chat-container"></div>
          </div>
          <div class="col-md-5">
            <div id="suggestions-container"></div>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- SCRIPTS & LOGIC -->
<script src="config.js"></script>
<script>
// ==========================================
// 1. UYGULAMA & AUTH YÖNETİMİ
// ==========================================
const App = {
  currentUser: null,
  activeEventId: null,

  async init() {
    const saved = localStorage.getItem('user_session');
    if (saved) {
      this.currentUser = JSON.parse(saved);
      this.showMainPanel();
    } else {
      document.getElementById('auth-panel').style.display = 'flex';
    }
  },

  async login() {
    const username = document.getElementById('login-username').value.trim();
    const email = document.getElementById('login-email').value.trim();
    if (!username || !email) return alert('Lütfen bilgileri girin.');

    let { data: user } = await supabase.from('users').select('*').eq('email', email).maybeSingle();
    if (!user) {
      const { data: newUser, error } = await supabase.from('users').insert({ username, email, role: 'user' }).select().single();
      if (error) return alert('Giriş hatası: ' + error.message);
      user = newUser;
    }
    this.currentUser = user;
    localStorage.setItem('user_session', JSON.stringify(user));
    document.getElementById('auth-panel').style.display = 'none';
    this.showMainPanel();
  },

  logout() {
    localStorage.removeItem('user_session');
    location.reload();
  },

  async showMainPanel() {
    document.getElementById('auth-panel').style.display = 'none';
    document.getElementById('main-panel').style.display = 'flex';
    document.getElementById('user-nav').innerHTML = `
      <span class="text-white small me-2">${this.currentUser.username}</span>
      <button class="btn btn-sm btn-outline-danger" onclick="App.logout()">Çıkış</button>
    `;

    CalendarModule.init();
    this.loadEvents();
  },

  async loadEvents() {
    const { data: events } = await supabase.from('events').select('*').order('id', { ascending: false });
    const list = document.getElementById('events-list');
    list.innerHTML = '';
    (events || []).forEach(e => {
      const item = document.createElement('div');
      item.className = 'p-2 rounded bg-dark border border-secondary d-flex justify-content-between align-items-center cursor-pointer';
      item.style.cursor = 'pointer';
      item.innerHTML = `
        <div>
          <strong class="text-white d-block">${e.title}</strong>
          <small class="text-muted">${e.location || 'Konum yok'} | ${e.event_date || ''}</small>
        </div>
        <button class="btn btn-sm btn-cyber" onclick="App.selectEvent(${e.id}, '${e.title}', '${e.location || ''}')">Odaya Gir</button>
      `;
      list.appendChild(item);
    });
  },

  selectEvent(id, title, location) {
    this.activeEventId = id;
    document.getElementById('room-placeholder').style.display = 'none';
    document.getElementById('room-panel').style.display = 'flex';
    document.getElementById('active-event-title').innerText = title;
    document.getElementById('active-event-meta').innerText = location;

    // Modülleri Başlat
    RSVPManager.loadRequests(id);
    ExpensesModule.init(id);
    TasksModule.init(id);
    ChatModule.init(id);
  }
};

// ==========================================
// 2. İNTERAKTİF GERÇEK TAKVİM & SAAT SEÇİMİ
// ==========================================
const CalendarModule = {
  currentDate: new Date(),
  selectedDate: null,
  userSlots: new Set(),

  init() {
    this.renderMonth();
    this.setupRealtime();
  },

  changeMonth(delta) {
    this.currentDate.setMonth(this.currentDate.getMonth() + delta);
    this.renderMonth();
  },

  renderMonth() {
    const year = this.currentDate.getFullYear();
    const month = this.currentDate.getMonth();
    const monthTitle = new Intl.DateTimeFormat('tr-TR', { month: 'long', year: 'numeric' }).format(this.currentDate);
    document.getElementById('cal-month-title').innerText = monthTitle.toUpperCase();

    const grid = document.getElementById('calendar-days-grid');
    grid.innerHTML = '';

    const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="p-2"></div>`;
    }

    const todayStr = new Date().toISOString().split('T')[0];

    for (let day = 1; day <= totalDays; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = `cal-day-cell rounded small ${dateStr === todayStr ? 'border-cyber' : ''}`;
      cell.innerText = day;
      cell.onclick = () => this.openSlotPicker(dateStr);
      grid.appendChild(cell);
    }
  },

  async openSlotPicker(dateStr) {
    this.selectedDate = dateStr;
    document.getElementById('slot-picker-drawer').style.display = 'block';
    document.getElementById('slot-picker-date').innerText = `Tarih: ${dateStr}`;

    const { data: slots } = await supabase
      .from('user_availability')
      .select('slot_hour')
      .eq('user_id', App.currentUser.id)
      .eq('slot_date', dateStr);

    this.userSlots = new Set((slots || []).map(s => s.slot_hour));
    this.renderHourButtons();
  },

  renderHourButtons() {
    const container = document.getElementById('slot-hours-grid');
    container.innerHTML = '';
    for (let h = 8; h <= 23; h++) {
      const isSelected = this.userSlots.has(h);
      const btn = document.createElement('button');
      btn.className = `btn btn-xs py-1 px-2 ${isSelected ? 'btn-success' : 'btn-outline-secondary'}`;
      btn.innerText = `${String(h).padStart(2, '0')}:00`;
      btn.onclick = () => this.toggleSlot(h);
      container.appendChild(btn);
    }
  },

  async toggleSlot(hour) {
    if (this.userSlots.has(hour)) {
      this.userSlots.delete(hour);
      await supabase.from('user_availability').delete()
        .eq('user_id', App.currentUser.id)
        .eq('slot_date', this.selectedDate)
        .eq('slot_hour', hour);
    } else {
      this.userSlots.add(hour);
      await supabase.from('user_availability').upsert({
        user_id: App.currentUser.id,
        slot_date: this.selectedDate,
        slot_hour: hour,
        is_booked: false
      });
    }
    this.renderHourButtons();
  },

  closeSlotPicker() {
    document.getElementById('slot-picker-drawer').style.display = 'none';
  },

  setupRealtime() {
    supabase.channel('public:cal_avail')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'user_availability' }, () => {
        if (this.selectedDate) this.openSlotPicker(this.selectedDate);
      }).subscribe();
  }
};

// ==========================================
// 3. KATILIMCI ONAY PANELİ (RSVP MANAGER)
// ==========================================
const RSVPManager = {
  async loadRequests(eventId) {
    const container = document.getElementById('rsvp-requests-container');
    const { data: requests } = await supabase
      .from('event_join_requests')
      .select('id, status, user_id, users(username, email)')
      .eq('event_id', eventId);

    container.innerHTML = `<h6 class="text-cyber mb-2">👥 Katılım Onay Paneli (RSVP)</h6>`;
    if (!requests || requests.length === 0) {
      container.innerHTML += `<small class="text-muted">Bekleyen veya kayıtlı katılım isteği yok.</small>`;
      return;
    }

    requests.forEach(r => {
      const uName = r.users?.username || r.users?.email || 'Anonim';
      container.innerHTML += `
        <div class="d-flex justify-content-between align-items-center bg-dark p-2 rounded mb-2 border border-secondary">
          <span class="small text-white">${uName}</span>
          <div class="d-flex align-items-center gap-2">
            <span class="badge ${r.status === 'accepted' ? 'bg-success' : r.status === 'rejected' ? 'bg-danger' : 'bg-warning'}">${r.status}</span>
            ${r.status === 'pending' ? `
              <button class="btn btn-sm btn-success py-0 px-2" onclick="RSVPManager.updateStatus(${r.id}, 'accepted',${r.user_id})">Onayla</button>
              <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="RSVPManager.updateStatus(${r.id}, 'rejected',${r.user_id})">Reddet</button>
            ` : ''}
          </div>
        </div>
      `;
    });

    supabase.channel('public:rsvp_' + eventId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'event_join_requests', filter: `event_id=eq.${eventId}` }, () => {
        this.loadRequests(eventId);
      }).subscribe();
  },

  async updateStatus(id, status, userId) {
    await supabase.from('event_join_requests').update({ status }).eq('id', id);
    if (status === 'accepted' && userId) {
      await supabase.from('event_access').upsert({ event_id: App.activeEventId, user_id: userId });
    }
    this.loadRequests(App.activeEventId);
  }
};

// ==========================================
// 4. SHARED EXPENSES POOL (SPLIT BILL)
// ==========================================
const ExpensesModule = {
  async init(eventId) {
    const c = document.getElementById('expenses-container');
    c.innerHTML = `
      <div class="glass-card p-3 h-100">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="text-cyber m-0">💸 Split Bill (Masraflar)</h6>
          <span id="exp-total" class="badge bg-success">0.00 TL</span>
        </div>
        <div class="input-group input-group-sm mb-2">
          <input type="text" id="exp-desc" class="form-control bg-dark text-white border-secondary" placeholder="Açıklama">
          <input type="number" id="exp-amount" class="form-control bg-dark text-white border-secondary" placeholder="Tutar" style="max-width: 80px;">
          <button class="btn btn-cyber" onclick="ExpensesModule.add()">Ekle</button>
        </div>
        <div id="exp-list" class="d-flex flex-column gap-1 overflow-auto" style="max-height: 180px;"></div>
      </div>
    `;
    this.load(eventId);
    supabase.channel('public:exp_' + eventId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'event_expenses', filter: `event_id=eq.${eventId}` }, () => this.load(eventId))
      .subscribe();
  },

  async load(eventId) {
    const { data } = await supabase.from('event_expenses').select('*, users(username)').eq('event_id', eventId).order('id', { ascending: false });
    const list = document.getElementById('exp-list');
    if (!list) return;
    let total = 0;
    list.innerHTML = (data || []).length === 0 ? '<small class="text-muted">Masraf yok.</small>' : '';
    (data || []).forEach(e => {
      total += parseFloat(e.amount || 0);
      list.innerHTML += `
        <div class="d-flex justify-content-between bg-dark p-1 px-2 rounded border border-secondary small">
          <span>${e.description} <em class="text-muted">(${e.users?.username || 'Kullanıcı'})</em></span>
          <strong class="text-cyber">${parseFloat(e.amount).toFixed(2)} TL</strong>
        </div>
      `;
    });
    document.getElementById('exp-total').innerText = `${total.toFixed(2)} TL`;
  },

  async add() {
    const desc = document.getElementById('exp-desc').value.trim();
    const amount = parseFloat(document.getElementById('exp-amount').value);
    if (!desc || isNaN(amount)) return;
    await supabase.from('event_expenses').insert({
      event_id: App.activeEventId,
      paid_by: App.currentUser.id,
      description: desc,
      amount
    });
    document.getElementById('exp-desc').value = '';
    document.getElementById('exp-amount').value = '';
  }
};

// ==========================================
// 5. WHO BRINGS WHAT? (TASKS)
// ==========================================
const TasksModule = {
  async init(eventId) {
    const c = document.getElementById('tasks-container');
    c.innerHTML = `
      <div class="glass-card p-3 h-100">
        <h6 class="text-cyber mb-2">🎒 Who Brings What?</h6>
        <div class="input-group input-group-sm mb-2">
          <input type="text" id="task-title" class="form-control bg-dark text-white border-secondary" placeholder="Malzeme / Görev">
          <button class="btn btn-cyber" onclick="TasksModule.add()">Ekle</button>
        </div>
        <div id="tasks-list" class="d-flex flex-column gap-1 overflow-auto" style="max-height: 180px;"></div>
      </div>
    `;
    this.load(eventId);
    supabase.channel('public:tasks_' + eventId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'event_tasks', filter: `event_id=eq.${eventId}` }, () => this.load(eventId))
      .subscribe();
  },

  async load(eventId) {
    const { data } = await supabase.from('event_tasks').select('*, users(username)').eq('event_id', eventId).order('id', { ascending: false });
    const list = document.getElementById('tasks-list');
    if (!list) return;
    list.innerHTML = (data || []).length === 0 ? '<small class="text-muted">Görev yok.</small>' : '';
    (data || []).forEach(t => {
      const isMine = t.assigned_to === App.currentUser.id;
      list.innerHTML += `
        <div class="d-flex justify-content-between align-items-center bg-dark p-1 px-2 rounded border border-secondary small">
          <span style="${t.is_completed ? 'text-decoration: line-through; opacity:0.6;' : ''}">
            <input type="checkbox" ${t.is_completed ? 'checked' : ''} onchange="TasksModule.toggle(${t.id}, this.checked)"> ${t.title}
          </span>
          <div>
            ${!t.assigned_to ? `<button class="btn btn-xs btn-outline-info py-0" onclick="TasksModule.assign(${t.id})">Al</button>` : ''}
            ${isMine ? `<button class="btn btn-xs btn-outline-danger py-0" onclick="TasksModule.unassign(${t.id})">Bırak</button>` : `<small class="text-muted">${t.users?.username || ''}</small>`}
          </div>
        </div>
      `;
    });
  },

  async add() {
    const title = document.getElementById('task-title').value.trim();
    if (!title) return;
    await supabase.from('event_tasks').insert({ event_id: App.activeEventId, title, is_completed: false });
    document.getElementById('task-title').value = '';
  },

  async assign(id) { await supabase.from('event_tasks').update({ assigned_to: App.currentUser.id }).eq('id', id); },
  async unassign(id) { await supabase.from('event_tasks').update({ assigned_to: null }).eq('id', id); },
  async toggle(id, is_completed) { await supabase.from('event_tasks').update({ is_completed }).eq('id', id); }
};

// ==========================================
// 6. LIVE ROOM CHAT & SUGGESTIONS
// ==========================================
const ChatModule = {
  async init(eventId) {
    document.getElementById('chat-container').innerHTML = `
      <div class="glass-card p-3 d-flex flex-column" style="height: 320px;">
        <h6 class="text-cyber mb-2">💬 Live Room Chat</h6>
        <div id="chat-msgs" class="flex-grow-1 overflow-auto d-flex flex-column gap-2 mb-2"></div>
        <div class="input-group input-group-sm">
          <input type="text" id="chat-input" class="form-control bg-dark text-white border-secondary" placeholder="Mesaj yaz...">
          <button class="btn btn-cyber" onclick="ChatModule.send()">Gönder</button>
        </div>
      </div>
    `;

    document.getElementById('suggestions-container').innerHTML = `
      <div class="glass-card p-3 d-flex flex-column" style="height: 320px;">
        <h6 class="text-cyber mb-2">💡 Live Event Ideas</h6>
        <div class="input-group input-group-sm mb-2">
          <input type="text" id="sugg-input" class="form-control bg-dark text-white border-secondary" placeholder="Fikir öner...">
          <button class="btn btn-cyber" onclick="ChatModule.addSugg()">Ekle</button>
        </div>
        <div id="sugg-list" class="flex-grow-1 overflow-auto d-flex flex-column gap-1"></div>
      </div>
    `;

    document.getElementById('chat-input').onkeypress = (e) => { if (e.key === 'Enter') ChatModule.send(); };

    this.loadMsgs(eventId);
    this.loadSuggs(eventId);

    supabase.channel('public:chat_' + eventId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'event_chat', filter: `event_id=eq.${eventId}` }, () => this.loadMsgs(eventId))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'event_suggestions', filter: `event_id=eq.${eventId}` }, () => this.loadSuggs(eventId))
      .subscribe();
  },

  async loadMsgs(eventId) {
    const { data } = await supabase.from('event_chat').select('*, users(username)').eq('event_id', eventId).order('created_at', { ascending: true });
    const box = document.getElementById('chat-msgs');
    if (!box) return;
    box.innerHTML = '';
    (data || []).forEach(m => {
      const isMe = m.user_id === App.currentUser.id;
      box.innerHTML += `
        <div class="d-flex flex-column ${isMe ? 'align-items-end' : 'align-items-start'}">
          <small class="text-muted" style="font-size:10px;">${m.users?.username || 'Anonim'}</small>
          <div class="p-2 rounded small ${isMe ? 'bg-info text-dark' : 'bg-dark text-white border border-secondary'}" style="max-width:80%;">
            ${m.message}
          </div>
        </div>
      `;
    });
    box.scrollTop = box.scrollHeight;
  },

  async send() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    await supabase.from('event_chat').insert({ event_id: App.activeEventId, user_id: App.currentUser.id, message: msg });
    input.value = '';
  },

  async loadSuggs(eventId) {
    const { data } = await supabase.from('event_suggestions').select('*').eq('event_id', eventId).order('votes', { ascending: false });
    const list = document.getElementById('sugg-list');
    if (!list) return;
    list.innerHTML = (data || []).length === 0 ? '<small class="text-muted">Öneri yok.</small>' : '';
    (data || []).forEach(s => {
      list.innerHTML += `
        <div class="d-flex justify-content-between align-items-center bg-dark p-1 px-2 rounded border border-secondary small">
          <span>${s.text}</span>
          <button class="btn btn-xs btn-outline-cyber py-0" onclick="ChatModule.upvote(${s.id}, ${s.votes || 0})">👍 ${s.votes || 0}</button>
        </div>
      `;
    });
  },

  async addSugg() {
    const input = document.getElementById('sugg-input');
    const text = input.value.trim();
    if (!text) return;
    await supabase.from('event_suggestions').insert({ event_id: App.activeEventId, user_id: App.currentUser.id, text, votes: 0 });
    input.value = '';
  },

  async upvote(id, current) {
    await supabase.from('event_suggestions').update({ votes: current + 1 }).eq('id', id);
  }
};

// Uygulamayı Başlat
window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
