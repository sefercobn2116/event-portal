<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Zero | The Master Plan</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(23, 32, 54, 0.75);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #38bdf8;
      --accent: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 60px;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 650px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    header { text-align: center; margin-bottom: 6px; }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header p { color: var(--text-muted); font-size: 1.05rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    /* Countdown */
    .countdown-title { text-align: center; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--primary); margin-bottom: 12px; font-weight: 600; }
    .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
    .time-box { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 12px; padding: 12px 6px; }
    .time-box .num { font-size: 1.8rem; font-weight: 700; color: #fff; }
    .time-box .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; }
    
    /* Activities */
    h2 { font-size: 1.25rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .activities-list { display: flex; flex-direction: column; gap: 10px; }
    .activity-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }
