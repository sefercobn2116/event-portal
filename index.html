<style>
  :root { --bg:#0f0f14; --card:#1a1a24; --accent:#7c5cff; --accent2:#00e0a4; --text:#eaeaf0; --muted:#9a9ab0; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px; }
  .hidden { display:none !important; }

  /* GİRİŞ EKRANI */
  .gate { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; }
  .gate h1 { font-size:2.2rem; margin-bottom:8px; }
  .gate h1 span { color:var(--accent); }
  .gate p { color:var(--muted); margin-bottom:24px; }
  .gate input { padding:14px 18px; border-radius:12px; border:1px solid #333; background:var(--card); color:var(--text); font-size:1.05rem; width:min(320px,90vw); text-align:center; outline:none; }
  .gate input:focus { border-color:var(--accent); }
  .btn { margin-top:14px; padding:13px 34px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; transition:.2s; }
  .btn:hover { filter:brightness(1.15); transform:translateY(-1px); }
  .btn:disabled { opacity:.5; cursor:wait; }
  .err { color:#ff6b81; margin-top:12px; min-height:1.2em; }

  /* ÜST BAR */
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid #26263a; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .badge { background:linear-gradient(135deg,var(--accent),#a48bff); padding:6px 14px; border-radius:999px; font-size:.85rem; font-weight:600; }
  .title { font-size:1.3rem; font-weight:700; }
  .title span { color:var(--accent2); }
  .exit { background:transparent; border:1px solid #3a3a55; color:var(--muted); padding:8px 14px; border-radius:10px; cursor:pointer; font-size:.85rem; }
  .exit:hover { border-color:#ff6b81; color:#ff6b81; }

  /* ETKİNLİK KARTLARI */
  .card { background:var(--card); border:1px solid #26263a; border-radius:16px; padding:20px; margin-bottom:16px; }
  .ev-title { font-size:1.25rem; font-weight:700; }
  .ev-date { color:var(--accent2); font-weight:600; margin:6px 0; font-size:.95rem; }
  .ev-desc { color:var(--muted); line-height:1.5; white-space:pre-wrap; }
  .empty { text-align:center; color:var(--muted); padding:50px 0; }

  /* ÖNERİLER */
  .sug { border-top:1px solid #26263a; margin-top:18px; padding-top:14px; }
  .sug h3, .up h3 { font-size:1rem; margin-bottom:10px; color:var(--accent2); }
  .sug-item { background:#12121c; border-radius:10px; padding:10px 14px; margin-bottom:8px; font-size:.92rem; }
  .sug-item b { color:var(--accent); }
  .sug-item small { color:var(--muted); display:block; margin-top:2px; }
  .sug form { display:flex; gap:8px; margin-top:10px; }
  .sug input { flex:1; padding:10px 14px; border-radius:10px; border:1px solid #333; background:#12121c; color:var(--text); outline:none; }
  .sug input:focus { border-color:var(--accent); }

  /* YÜKLEME + GALERİ */
  .up { margin-top:18px; }
  .file-btn { display:inline-block; padding:12px 22px; background:#12121c; border:1px dashed #444; border-radius:12px; cursor:pointer; color:var(--muted); }
  .file-btn:hover { border-color:var(--accent2); color:var(--text); }
  .prog { margin-top:10px; font-size:.88rem; color:var(--accent2); min-height:1.2em; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:14px; }
  .mem { position:relative; border-radius:12px; overflow:hidden; border:1px solid #26263a; background:#000; }
  .mem img, .mem video { width:100%; height:140px; object-fit:cover; display:block; }
  .mem a { display:block; text-align:center; padding:7px; font-size:.8rem; background:#12121c; color:var(--accent2); text-decoration:none; }
  .mem a:hover { background:#1c1c2c; }
  .cap { font-size:.72rem; color:var(--muted); text-align:center; padding:4px; background:#12121c; }
</style>
<base target="_blank">
</head>
<body>

<!-- GİRİŞ KAPISI -->
<div id="gate" class="gate">
  <h1>Plan <span>Zero</span> ✦</h1>
  <p>Hoş geldin! Devam etmek için davetli ismini yaz.</p>
  <input id="nameInput" type="text" placeholder="Adın (örn: Sefer)" autocomplete="off">
  <button class="btn" id="loginBtn" onclick="login()">Giriş Yap →</button>
  <div class="err" id="gateErr"></div>
</div>

<!-- PORTAL -->
<div id="portal" class="wrap hidden">
  <header>
    <span class="badge" id="userBadge"></span>
    <span class="title">Plan <span>Zero</span></span>
    <button class="exit" onclick="logout()">Çıkış / Değiştir ➔</button>
  </header>
  <div id="events"></div>
</div>

<script>
const LS_KEY = "pz_user";
const MAX_IMG = 1280; // piksel — büyük fotoğraflar otomatik küçültülür

// ---------- GİRİŞ / ÇIKIŞ ----------
async function login() {
  const name = document.getElementById("nameInput").value.trim();
  const err = document.getElementById("gateErr");
  const btn = document.getElementById("loginBtn");
  if (!name) { err.textContent = "Önce ismini yazmalısın."; return; }
  btn.disabled = true; btn.textContent = "Kontrol ediliyor...";
  const { data, error } = await sb.from("guests").select("name").ilike("name", name);
  btn.disabled = false; btn.textContent = "Giriş Yap →";
  if (error) { err.textContent = "Bağlantı hatası: " + error.message; return; }
  if (!data || data.length === 0) { err.textContent = "Bu isim davetli listesinde yok 😕"; return; }
  const realName = data[0].name;
  localStorage.setItem(LS_KEY, realName);
  openPortal(realName);
}

function logout() {
  localStorage.removeItem(LS_KEY);
  location.reload();
}

function openPortal(name) {
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("portal").classList.remove("hidden");
  document.getElementById("userBadge").textContent = "👋 " + name;
  loadEvents(name);
}

// ---------- ETKİNLİKLER ----------
async function loadEvents(userName) {
  const box = document.getElementById("events");
  box.innerHTML = "<div class='empty'>Etkinlikler yükleniyor...</div>";
  const { data: events, error } = await sb.from("events").select("*").order("event_date");
  if (error) { box.innerHTML = "<div class='empty'>Hata: " + error.message + "</div>"; return; }
  const mine = (events || []).filter(e => (e.allowed_guests || "").split(",").map(s=>s.trim()).includes(userName));
  if (mine.length === 0) { box.innerHTML = "<div class='empty'>Şu an için sana atanmış etkinlik yok.<br>Admin ekleyince burada görünecek.</div>"; return; }
  box.innerHTML = "";
  mine.forEach(ev => box.appendChild(renderEvent(ev, userName)));
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) +
         " · " + d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}

function renderEvent(ev, userName) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="ev-title">🎉 ${esc(ev.title)}</div>
    <div class="ev-date">📅 ${fmtDate(ev.event_date)}</div>
    <div class="ev-desc">${esc(ev.description || "")}</div>
    <div class="sug">
      <h3>💡 Fikir & Öneriler</h3>
      <div class="sug-list" id="sug-${ev.id}"><div class="sug-item">Yükleniyor...</div></div>
      <form onsubmit="return addSuggestion(event, ${ev.id}, '${esc(userName)}')">
        <input type="text" placeholder="Bir fikrin mi var? Yaz bakalım..." required>
        <button class="btn" style="margin-top:0">Gönder</button>
      </form>
    </div>
    <div class="up">
      <h3>📸 Anı Yükle</h3>
      <label class="file-btn">Fotoğraf / Video Seç (çoklu seçilebilir)
        <input type="file" multiple accept="image/*,video/*" style="display:none"
               onchange="uploadFiles(this, ${ev.id}, '${esc(userName)}')">
      </label>
      <div class="prog" id="prog-${ev.id}"></div>
      <div class="gallery" id="gal-${ev.id}"></div>
    </div>`;
  loadSuggestions(ev.id);
  loadGallery(ev.id);
  return card;
}

// ---------- ÖNERİLER ----------
async function loadSuggestions(evId) {
  const { data } = await sb.from("event_suggestions").select("*").eq("event_id", evId).order("created_at", {ascending:false});
  const list = document.getElementById("sug-" + evId);
  if (!list) return;
  if (!data || data.length === 0) { list.innerHTML = "<div class='sug-item'>Henüz öneri yok — ilk sen yaz!</div>"; return; }
  list.innerHTML = data.map(s => `<div class="sug-item"><b>${esc(s.suggested_by)}:</b> ${esc(s.text)}<small>${new Date(s.created_at).toLocaleString("tr-TR")}</small></div>`).join("");
}

async function addSuggestion(e, evId, userName) {
  e.preventDefault();
  const input = e.target.querySelector("input");
  const text = input.value.trim();
  if (!text) return false;
  await sb.from("event_suggestions").insert({ event_id: evId, suggested_by: userName, text });
  input.value = "";
  loadSuggestions(evId);
  return false;
}

// ---------- MEDYA YÜKLEME ----------
async function uploadFiles(input, evId, userName) {
  const prog = document.getElementById("prog-" + evId);
  const files = Array.from(input.files);
  input.value = "";
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    prog.textContent = `Yükleniyor ${i+1}/${files.length}: ${f.name}...`;
    try {
      let dataUrl, caption = "";
      if (f.type.startsWith("image/")) {
        dataUrl = await resizeImage(f, MAX_IMG);
      } else if (f.type.startsWith("video/")) {
        if (f.size > 40 * 1024 * 1024) { prog.textContent = `⚠️ "${f.name}" çok büyük (40MB+), atlandı.`; continue; }
        dataUrl = await readAsDataURL(f);
        caption = "[video]";
      } else continue;

      const { error } = await sb.from("event_memories").insert({
        event_id: evId, image_data: dataUrl, caption, uploaded_by: userName
      });
      if (error) throw new Error(error.message);
    } catch (err) {
      prog.textContent = `❌ "${f.name}" yüklenemedi: ${err.message}`;
    }
  }
  prog.textContent = "✅ Yükleme tamamlandı!";
  setTimeout(() => prog.textContent = "", 4000);
  loadGallery(evId);
}

function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function resizeImage(file, maxDim) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width: w, height: h } = img;
      if (w > maxDim || h > maxDim) {
        const ratio = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(canvas.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = rej;
    img.src = url;
  });
}

// ---------- GALERİ ----------
async function loadGallery(evId) {
  const gal = document.getElementById("gal-" + evId);
  if (!gal) return;
  const { data } = await sb.from("event_memories").select("*").eq("event_id", evId).order("created_at", {ascending:false});
  if (!data || data.length === 0) { gal.innerHTML = ""; return; }
  gal.innerHTML = "";
  data.forEach((m, idx) => {
    const isVideo = m.caption && m.caption.includes("[video]");
    const div = document.createElement("div");
    div.className = "mem";
    const inner = isVideo
      ? `<video src="${m.image_data}" controls preload="metadata"></video>`
      : `<img src="${m.image_data}" loading="lazy" alt="">`;
    div.innerHTML = `${inner}
      <div class="cap">${esc(m.uploaded_by || "Misafir")}</div>
      <a href="${m.image_data}" download="ani-${evId}-${idx+1}${isVideo ? ".mp4" : ".jpg"}">⬇️ İndir</a>`;
    gal.appendChild(div);
  });
}

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

// ---------- BAŞLAT ----------
document.getElementById("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
const saved = localStorage.getItem(LS_KEY);
if (saved) openPortal(saved);
</script>
</body>
</html>
