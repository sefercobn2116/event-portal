<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Portalı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Arka Plan Müziği -->
  <audio id="bg-audio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
  </audio>

  <!-- 1. Giriş Ekranı -->
  <div id="login-section" class="container">
    <div class="glass-box login-wrap">
      <h1>Portala Giriş</h1>
      <p style="color: #94a3b8; font-size: 0.9rem;">Devam etmek için adını yaz</p>
      
      <input type="text" id="username-input" class="input-field" placeholder="Örn: sefer" autocomplete="off" />
      <button id="btn-login" class="btn">Giriş Yap ve Başla</button>
      <p id="login-err" style="color: #f43f5e; margin-top: 12px; font-size: 0.85rem; display: none;"></p>
    </div>
  </div>

  <!-- 2. Etkinlik Vitrini (Giriş Yapılınca Açılır) -->
  <div id="dashboard-section" class="container" style="display: none;">
    <div class="nav-header">
      <div>
        <h2 id="welcome-text">Hoş Geldin</h2>
        <span style="font-size: 0.85rem; color: #94a3b8;">Etkinlikler paneli</span>
      </div>
      <div>
        <a id="admin-link" href="admin.html" style="display: none; margin-right: 15px;">Admin Paneli</a>
        <button id="btn-logout" style="background: none; border: 1px solid rgba(255,255,255,0.2); color:#fff; border-radius: 8px; padding: 6px 12px; cursor: pointer;">Çıkış</button>
      </div>
    </div>

    <div id="events-list" class="events-grid">
      <!-- Etkinlik kartları JS ile yüklenecek -->
    </div>
  </div>

  <script type="module">
    import { supabase } from './config.js';

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const usernameInput = document.getElementById('username-input');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const loginErr = document.getElementById('login-err');
    const eventsList = document.getElementById('events-list');
    const welcomeText = document.getElementById('welcome-text');
    const adminLink = document.getElementById('admin-link');
    const audio = document.getElementById('bg-audio');

    // Sayfa açıldığında kayıtlı kullanıcı var mı kontrol et
    const savedUser = JSON.parse(localStorage.getItem('portal_user'));
    if (savedUser) {
      renderDashboard(savedUser);
    }

    btnLogin.addEventListener('click', async () => {
      const username = usernameInput.value.trim().toLowerCase();
      loginErr.style.display = 'none';

      if (!username) {
        loginErr.textContent = 'Lütfen adınızı yazın.';
        loginErr.style.display = 'block';
        return;
      }

      // Supabase'den kontrol et
      const { data: user, error } = await supabase
        .from('users')
        .select('*')
        .ilike('username', username)
        .maybeSingle();

      if (error || !user) {
        loginErr.textContent = 'Bu isim sisteme kayıtlı değil.';
        loginErr.style.display = 'block';
        return;
      }

      if (!user.is_active) {
        loginErr.textContent = 'Giriş izniniz pasif durumdadır.';
        loginErr.style.display = 'block';
        return;
      }

      // Kullanıcı onaylandı, müziği çal
      audio.play().catch(() => console.log('Ses başlatılamadı'));

      localStorage.setItem('portal_user', JSON.stringify(user));
      renderDashboard(user);
    });

    btnLogout.addEventListener('click', () => {
      localStorage.removeItem('portal_user');
      location.reload();
    });

    async function renderDashboard(user) {
      loginSection.style.display = 'none';
      dashboardSection.style.display = 'block';
      welcomeText.textContent = `Hoş Geldin, ${user.username.toUpperCase()}`;

      if (user.is_admin) {
        adminLink.style.display = 'inline';
      }

      // 1. Tüm etkinlikleri çek
      const { data: allEvents, error: evError } = await supabase
        .from('events')
        .select('*')
        .order('created_at', { ascending: false });

      // 2. Kullanıcının erişebildiği etkinlikleri çek
      const { data: userAccess } = await supabase
        .from('event_access')
        .select('event_id')
        .eq('user_id', user.id);

      const allowedIds = new Set((userAccess || []).map(a => a.event_id));

      eventsList.innerHTML = '';
      if (!allEvents || allEvents.length === 0) {
        eventsList.innerHTML = '<p>Henüz eklenmiş etkinlik yok.</p>';
        return;
      }

      allEvents.forEach(evt => {
        // Admin ise her etkinliğe girebilir, değilse yetkisi var mı bak
        const canAccess = user.is_admin || allowedIds.has(evt.id);

        const card = document.createElement('div');
        card.className = `event-card ${canAccess ? 'allowed' : 'locked'}`;
        card.innerHTML = `
          <div>
            <h3 style="font-size: 1.25rem; margin-bottom: 8px;">${evt.title}</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; line-height: 1.4;">${evt.description || 'Açıklama belirtilmedi.'}</p>
          </div>
          <div>
            ${canAccess 
              ? `<span class="badge badge-open">Tıkla ve Katıl →</span>` 
              : `<span class="badge badge-lock">🔒 Kilitli</span>`}
          </div>
        `;

        if (canAccess) {
          card.addEventListener('click', () => {
            window.location.href = `event.html?id=${evt.id}`;
          });
        }

        eventsList.appendChild(card);
      });
    }
  </script>
</body>
</html>
