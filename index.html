<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Zero | Canlı Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://gzwuaorcfboiwztjpgng.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6d3Vhb3JjZmJvaXd6dGpwZ25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzIwODcsImV4cCI6MjEwNjg0ODA4N30.Z4xDS_h6sySGnro7EcUOO5b9S5OcJ61rujsCHLl6Ffc";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<style>
  :root { --bg:#0f0f14; --card:#1a1a24; --accent:#7c5cff; --accent2:#00e0a4; --text:#eaeaf0; --muted:#9a9ab0; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px; }
  .hidden { display:none !important; }

  .gate { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; }
  .gate input { padding:14px 18px; border-radius:12px; border:1px solid #333; background:var(--card); color:var(--text); font-size:1.05rem; width:min(320px,90vw); text-align:center; outline:none; }
  .btn { margin-top:14px; padding:13px 34px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }

  header { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid #26263a; margin-bottom:20px; }
  .badge { background:linear-gradient(135deg,var(--accent),#a48bff); padding:6px 14px; border-radius:999px; font-size:.85rem; font-weight:600; }
  .exit { background:transparent; border:1px solid #3a3a55; color:var(--muted); padding:8px 14px; border-radius:10px; cursor:pointer; }

  .event-item { background:var(--card); border:1px solid #26263a; border-radius:16px; padding:20px; margin-bottom:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .event-item:hover { border-color:var(--accent); }
  .card { background:var(--card); border:1px solid #26263a; border-radius:16px; padding:20px; margin-bottom:16px; }
  .file-btn { display:inline-block; padding:12px 22px; background:#12121c; border:1px dashed #444; border-radius:12px; cursor:pointer; color:var(--muted); margin-top:10px; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:14px; }
  .mem { border-radius:12px; overflow:hidden; border:1px solid #26263a; }
  .mem img { width:100%; height:130px; object-fit:cover; display:block; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1 id="appTitle">Plan Zero ✦</h1>
  <p style="color:var(--muted); margin: 8px 0 20px;">Giriş yapmak için adını yaz.</p>
  <input id="nameInput" type="text" placeholder="Adın (örn: Sefer)">
  <button class="btn" onclick="login()">Giriş Yap →</button>
  <div id="gateErr" style="color:#ff6b81; margin-top:12px;"></div>
</div>

<div id="portal" class="wrap hidden">
  <header>
    <span class="badge" id="userBadge"></span>
    <button class="exit" onclick="logout()">Çıkış ➔</button>
  </header>

  <div id="viewSelection">
    <h2 style="font-size:1.1rem; color:var(--accent2); margin-bottom:14px;">🎟️ Katılabileceğin Etkinlikler:</h2>
    <div id="eventsContainer"></div>
  </div>

  <div id="viewRoom" class="hidden">
    <button onclick="backToList()" style="background:none;border:none;color:var(--muted);cursor:pointer;margin-bottom:14px;">← Geri Dön</button>
    <div id="roomCard"></div>
  </div>
</div>

<script>
let appData = { guests: [], events: [] };
let currentUser = localStorage.getItem("pz_user");

async function initEngine() {
  const { data } = await sb.from("remote_config").select("payload").eq("id", 1).maybeSingle();
  if (data && data.payload) {
    try {
      appData = JSON.parse(data.payload);
      if (appData.project_title) document.getElementById("appTitle").innerText = appData.project_title;
    } catch(e) { console.error("JSON parse hatası", e); }
  }
  if (currentUser) openPortal();
}

function login() {
  const name = document.getElementById("nameInput").value.trim();
  const err = document.getElementById("gateErr");
  if (!name) return;

  const valid = appData.guests.some(g => g.toLowerCase() === name.toLowerCase());
  if (valid) {
    currentUser = name;
    localStorage.setItem("pz_user", name);
    openPortal();
  } else {
    err.innerText = "Bu isim izinli listede yok.";
  }
}

function logout() {
  localStorage.removeItem("pz_user");
  location.reload();
}

function openPortal() {
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("portal").classList.remove("hidden");
  document.getElementById("userBadge").innerText = "👋 " + currentUser;

  const container = document.getElementById("eventsContainer");
  container.innerHTML = "";

  const myEvents = appData.events.filter(e => 
    e.allowed_guests.some(ag => ag.toLowerCase() === currentUser.toLowerCase())
  );

  if (myEvents.length === 0) {
    container.innerHTML = "<p style='color:var(--muted)'>Sana atanmış bir etkinlik yok.</p>";
    return;
  }

  myEvents.forEach(ev => {
    const item = document.createElement("div");
    item.className = "event-item";
    item.innerHTML = `<div><h3>🎉 ${ev.title}</h3><p style="color:var(--accent2); font-size:.85rem;">📅 ${ev.date}</p></div><div>Giriş ➔</div>`;
    item.onclick = () => openRoom(ev);
    container.appendChild(item);
  });
}

function openRoom(ev) {
  document.getElementById("viewSelection").classList.add("hidden");
  document.getElementById("viewRoom").classList.remove("hidden");

  document.getElementById("roomCard").innerHTML = `
    <div class="card">
      <h2>🎉 ${ev.title}</h2>
      <p style="color:var(--muted); margin: 8px 0;">${ev.description}</p>
      <label class="file-btn">Fotoğraf Yükle
        <input type="file" multiple accept="image/*" style="display:none" onchange="uploadMemories(this, ${ev.id})">
      </label>
      <div id="galStatus" style="color:var(--accent2); margin-top:8px;"></div>
      <div class="gallery" id="roomGallery"></div>
    </div>
  `;
  loadVault(ev.id);
}

function backToList() {
  document.getElementById("viewRoom").classList.add("hidden");
  document.getElementById("viewSelection").classList.remove("hidden");
}

async function uploadMemories(input, eventId) {
  const files = Array.from(input.files);
  const status = document.getElementById("galStatus");
  status.innerText = "Yükleniyor...";

  for (let file of files) {
    const reader = new FileReader();
    reader.onload = async (e) => {
      await sb.from("event_memories").insert([{
        event_id: eventId,
        image_data: e.target.result,
        uploaded_by: currentUser
      }]);
      loadVault(eventId);
    };
    reader.readAsDataURL(file);
  }
  status.innerText = "Yüklendi!";
  setTimeout(() => status.innerText = "", 2000);
}

async function loadVault(eventId) {
  const { data } = await sb.from("event_memories").select("*").eq("event_id", eventId).order("created_at", { ascending: false });
  const gal = document.getElementById("roomGallery");
  if (!gal) return;
  gal.innerHTML = (data || []).map(m => `<div class="mem"><img src="${m.image_data}"></div>`).join("");
}

initEngine();
</script>
</body>
</html>
